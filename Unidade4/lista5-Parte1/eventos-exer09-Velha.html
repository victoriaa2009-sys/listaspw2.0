<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
        }

        button {
            width: 100px;
            height: 100px;
            font-size: 24px;
            cursor: pointer;
            background-color: #fff;
            border: 2px solid #000;
            border-radius: 5px;
        }

        button:hover {
            background-color: #f0f0f0;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
<!--9 – Programe um jogo da velha usando como base o arquivo eventos-exer09-Velha.html.-->
    <div>
        <h1>Jogo da Velha</h1>
        <div class="board">
            <button id="btn1"></button>
            <button id="btn2"></button>
            <button id="btn3"></button>
            <button id="btn4"></button>
            <button id="btn5"></button>
            <button id="btn6"></button>
            <button id="btn7"></button>
            <button id="btn8"></button>
            <button id="btn9"></button>
        </div>
    </div>
    <script>
        const buttons = document.querySelectorAll('.board button');
        let currentPlayer = 'X';

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                if (button.textContent === '') {
                    button.textContent = currentPlayer;
                    if (checkWinner()) {
                        alert(`Jogador ${currentPlayer} venceu!`);
                        resetBoard();
                    } else if (isBoardFull()) {
                        alert('Empate!');
                        resetBoard();
                    } else {
                        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                    }
                }
            });
        });

        function checkWinner() {
            const winningCombinations = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6]
            ];

            return winningCombinations.some(combination => {
                return combination.every(index => {
                    return buttons[index].textContent === currentPlayer;
                });
            });
        }

        function isBoardFull() {
            return [...buttons].every(button => button.textContent !== '');
        }

        function resetBoard() {
            buttons.forEach(button => button.textContent = '');
            currentPlayer = 'X';
        }

    </script>
</body>
</html>
